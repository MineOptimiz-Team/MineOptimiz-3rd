name: Package Modpack

on:
  push:
    paths-ignore: 
      - 'README.md'
  workflow_dispatch:

jobs:
  Package-Modpack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v2
          
      - run: git config user.email "${{ github.actor }}@users.noreply.github.com"
        if: ${{ github.repository_owner != 'github-actions' }}

      - run: git config user.name "${{ github.actor }}"
        if: ${{ github.repository_owner != 'github-actions' }}   
        
      - name: Get commit id
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Write commit id to files
        run: |
          sed -i "s/\(commitid\)/2/g" modrinth.index.json
          sed -i "s/\(commitid\)/2/g" ./overrides/config/modpack-update-checker/config.json
      
      - name: Package Modpack
        run: |
          rm -rf .github
          rm -rf .git
          rm README.md
          zip -r "./MineOptimiz.zip" ./*
          mv MineOptimiz.zip "MineOptimiz v3.211.1-neoforge+2.mrpack"
      
      - uses: actions/upload-artifact@v4
        with:
          name: MineOptimiz v3.211.1-neoforge+2
          path: "./MineOptimiz v3.211.1-neoforge+2.mrpack"
     
