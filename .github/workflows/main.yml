name: Export Modrinth Pack

on:
  push:
    paths-ignore: 
      - 'README.md'
      - 'refresh_index.yml'
  workflow_dispatch:

jobs:
  Export-Modpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        
      - name: Get Commit ID
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Append short SHA to file content
        run: |
          sed -i "s/\(commitid\)/${{ env.SHORT_SHA }}/g" ./overrides/pack.toml
          sed -i "s/\(commitid\)/${{ env.SHORT_SHA }}/g" ./overrides/config/modpack-update-checker/config.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.3"
          cache: false

      - name: Install Packwiz
        run: go install github.com/packwiz/packwiz@latest
      
      - name: Export Modrinth Pack
        run: |
          cd overrides
          packwiz modrinth export
          mv ./*.mrpack "MineOptimiz v3.201.4-forge+${{ env.SHORT_SHA }}.mrpack"
      
      - name: Upload Modpack
        uses: actions/upload-artifact@v4
        with:
          name: MineOptimiz v3.201.4-forge+${{ env.SHORT_SHA }}
          path: ./overrides/*.mrpack
     