name: Package Modpack

on:
  push:
    paths-ignore: 
      - 'README.md'
      - 'licenceofmods.txt'
  workflow_dispatch:

jobs:
  Package-Modpack:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
          
      - run: git config user.email "${{ github.actor }}@users.noreply.github.com"
        if: ${{ github.repository_owner != 'github-actions' }}

      - run: git config user.name "${{ github.actor }}"
        if: ${{ github.repository_owner != 'github-actions' }}   

      - name: Write release id to the file
        run: |
          sed -i "s/\(commitid\)/1/g" modrinth.index.json
          sed -i "s/\(commitid\)/1/g" ./overrides/config/modpack-update-checker/config.json
      
      - name: Package Modpack
        run: |
          rm -rf .github
          rm -rf .git
          zip -r "./MineOptimiz.zip" ./*
          mv MineOptimiz.zip "MineOptimiz v3.182.1-forge+1.mrpack"
      
      - uses: actions/upload-artifact@v4
        with:
          name: MineOptimiz v3.182.1-forge+1.zip
          path: "./MineOptimiz v3.182.1-forge+1.mrpack"
     
