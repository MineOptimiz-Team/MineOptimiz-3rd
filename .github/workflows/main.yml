name: Export Modrinth Pack

on:
  push:
    branches: '20.1/forge_testing'
    
    paths-ignore: 
      - 'README.md'
      - 'refresh_index.yml'
  workflow_dispatch:

jobs:
  Export-Modpack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        
      - name: Get commit id
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Write commit id to files
        run: |
          sed -i "s/\(commitid\)/${{ env.SHORT_SHA }}/g" ./overrides/pack.toml
          sed -i "s/\(commitid\)/${{ env.SHORT_SHA }}/g" ./overrides/config/modpack-update-checker/config.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.3"
          cache: false    

      - name: Install Packwiz
        run: go install github.com/packwiz/packwiz@latest
      
      - name: Export Modrinth Pack
        run: |
          cd overrides
          packwiz modrinth export
          mv ./*.mrpack "MineOptimiz v3.214.0-fabric+${{ env.SHORT_SHA }}.mrpack"
          cp ./"MineOptimiz v3.214.0-fabric+${{ env.SHORT_SHA }}.mrpack" "MineOptimiz v3.214.0-fabric+testing_latest.mrpack"
      
      - name: Upload MineOptimiz to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MineOptimiz v3.214.0-fabric+${{ env.SHORT_SHA }}
          path: "./overrides/MineOptimiz v3.214.0-fabric+${{ env.SHORT_SHA }}.mrpack"
     
      - name: Upload MineOptimiz to Releases
        uses: marvinpinto/action-automatic-releases@master
        with:
          title: "MineOptimiz 1.21.4 Fabric Testing Latest"
          automatic_release_tag: "1.21.4_fabric_latest_testing"
          repo_token: "${{ secrets.UPLOAD_TO_RELEASES }}"
          files: "./overrides/MineOptimiz v3.214.0-fabric+testing_latest.mrpack"
          prerelease: true
        