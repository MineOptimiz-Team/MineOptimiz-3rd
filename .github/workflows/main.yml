name: Export Modrinth Pack

on:
  push:
    paths-ignore: 
      - 'README.md'
      - 'refresh_index.yml'
  workflow_dispatch:

jobs:
  Export-Modpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        
      - name: Get Commit ID
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Append short SHA to file content
        run: |
          sed -i "s/\(commitid\)/${{ env.SHORT_SHA }}/g" ./overrides/pack.toml
          sed -i "s/\(commitid\)/${{ env.SHORT_SHA }}/g" ./overrides/config/modpack-update-checker/config.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.3"
          cache: false

      - name: Install Packwiz
        run: go install github.com/packwiz/packwiz@latest
      
      - name: Export Modrinth Pack
        run: |
          cd overrides
          packwiz modrinth export
          mv ./*.mrpack "MineOptimiz v3.201.4-forge+${{ env.SHORT_SHA }}.mrpack"
          cp ./"MineOptimiz v3.201.4-forge+${{ env.SHORT_SHA }}.mrpack" "MineOptimiz v3.201.4-forge+testing_latest.mrpack"
      
      - name: Upload MineOptimiz to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MineOptimiz v3.201.4-forge+${{ env.SHORT_SHA }}
          path: ./overrides/*.mrpack
     
      - name: Upload MineOptimiz to Releases
        uses: marvinpinto/action-automatic-releases@master
        with:
          title: "MineOptimiz 1.20.1 Forge Testing Latest"
          automatic_release_tag: "1.20.1_forge_latest_testing"
          repo_token: "${{ secrets.UPLOAD_TO_RELEASES }}"
          files: "./overrides/MineOptimiz v3.201.4-forge+testing_latest.mrpack"
          prerelease: true
        